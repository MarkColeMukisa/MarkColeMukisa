name: Generate profile card

on:
  push:
    branches:
      - main
    paths:
      - generate.py
      - .github/workflows/generate-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate profile cards
        run: python generate.py

      - name: Commit generated cards
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "Profile cards are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "Regenerate profile cards"
          git push
